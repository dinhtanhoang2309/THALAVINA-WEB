<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none">
  <defs>
    <!-- Ocean Wave Gradients -->
    <linearGradient id="waveDeepGrad" x1="0%" y1="100%" x2="60%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="waveBackGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="thermometerGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="70%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular/Atmospheric Ocean Aura Background -->
  <ellipse cx="190" cy="180" rx="160" ry="110" fill="#032541" opacity="0.6"/>
  <ellipse cx="170" cy="170" rx="130" ry="85" fill="#075985" opacity="0.3"/>

  <!-- Back Wave Body -->
  <path d="M40 230 C90 230 110 170 145 130 C175 95 210 90 240 120 C220 125 195 135 180 155 C160 180 145 220 70 235 Z" fill="url(#waveBackGrad)" opacity="0.75"/>

  <!-- Main Surging Ocean Wave Body -->
  <path d="M40 240 C95 240 125 210 155 170 C190 125 225 105 260 110 C275 112 285 120 280 135 C275 145 255 155 235 155 C195 155 185 185 160 215 C135 245 80 245 40 240 Z" fill="url(#waveDeepGrad)"/>

  <!-- Stylized Crest Foam Spray -->
  <path d="M260 110 C270 102 285 108 285 120 C285 130 270 140 255 140 C270 132 278 120 268 114 C262 110 252 115 245 120 C238 108 220 108 215 118" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M155 170 C165 155 185 140 215 130" stroke="#f0f9ff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M120 210 C140 190 170 175 200 165" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Outer Foam Ribbons -->
  <circle cx="288" cy="118" r="4" fill="#ffffff"/>
  <circle cx="275" cy="102" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="295" cy="132" r="2.5" fill="#bae6fd"/>

  <!-- Ocean Warming Thermometer on the Right -->
  <g transform="translate(290, 60)">
    <!-- Thermometer Glass Casing -->
    <rect x="12" y="10" width="24" height="150" rx="12" fill="#082f49" stroke="#38bdf8" stroke-width="3.5" opacity="0.95"/>
    <circle cx="24" cy="180" r="26" fill="#082f49" stroke="#38bdf8" stroke-width="3.5"/>

    <!-- Degree Tick Marks -->
    <line x1="38" y1="35" x2="48" y2="35" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="38" y1="55" x2="45" y2="55" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>
    <line x1="38" y1="75" x2="48" y2="75" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="38" y1="95" x2="45" y2="95" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>
    <line x1="38" y1="115" x2="48" y2="115" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="38" y1="135" x2="45" y2="135" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>

    <!-- Thermometer Mercury Fluid Column -->
    <rect x="18" y="45" width="12" height="120" rx="6" fill="url(#thermometerGrad)"/>
    <!-- Thermometer Bulb Fluid -->
    <circle cx="24" cy="180" r="19" fill="#ef4444"/>
    <!-- Glass Highlight Reflection -->
    <path d="M15 25 V145" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <circle cx="18" cy="172" r="5" fill="#ffffff" opacity="0.6"/>
  </g>
</svg>
